apiVersion: v1
kind: Service
metadata:
  name: audio-transcriber-service
  namespace: transcriber
spec:
  selector:
    app: audio-transcriber   # must match your Deployment's labels
  ports:
    - protocol: TCP
      port: 8000       # service port
      targetPort: 8000 # container port
  type: NodePort       # expose via NodePort (simple for minikube)

