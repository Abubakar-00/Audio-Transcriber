<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Transcriber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #374151; /* neutral.gray700 */
            background-color: #f9fafb; /* neutral.gray50 */
        }
        
        .sidebar-toggle { 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            width: 280px; /* Slightly wider sidebar */
            background: #ffffff; /* White background for sidebar */
            border-right: 1px solid #e5e7eb; /* neutral.gray200 */
            padding: 2rem; /* Consistent padding */
        }
        .sidebar-toggle.collapsed { 
            transform: translateX(-100%); 
        }

        .toggle-btn { 
            position: fixed; 
            left: 20px; 
            top: 20px; 
            z-index: 30; /* Ensure it's above everything */
            background: #2563eb; /* primary.main */
            color: white; 
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer; 
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        .toggle-btn:hover {
            background: #1d4ed8; /* primary.dark */
            transform: translateY(-1px);
        }

        .content { 
            transition: margin-left 0.3s ease; 
            background: #ffffff;
            padding: 3rem;
        }
        .content.expanded { 
            margin-left: 280px; /* Match sidebar width */
        }
        .content.collapsed { 
            margin-left: 0; /* Content takes full width when sidebar is collapsed */
        }

        h1, h2 {
            font-weight: 600; /* Semi-bold for headings */
            color: #111827; /* neutral.gray900 */
        }

        /* Form element styling */
        select, input[type="text"], textarea {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #d1d5db; /* neutral.gray300 */
            background-color: #ffffff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        select:focus, input[type="text"]:focus, textarea:focus {
            border-color: #2563eb; /* primary.main */
            outline: 2px solid #dbeafe;
            outline-offset: 2px;
        }
        input[type="radio"]:checked + span::before, input[type="checkbox"]:checked + span::before {
            background-color: #2563eb; /* primary.main */
            border-color: #2563eb;
        }

        .folder-box { 
            background: #ffffff; 
            border: 2px dashed #d1d5db; /* neutral.gray300 */
            transition: all 0.3s ease; 
            cursor: pointer; 
            padding: 2.5rem 1.5rem;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #4b5563; /* neutral.gray600 */
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }
        .folder-box:hover { 
            background: #f9fafb; /* neutral.gray50 */
            border-color: #2563eb; /* primary.main */
            transform: translateY(-2px); /* Slight lift effect */
            box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1);
        }
        .folder-box p {
            margin-bottom: 8px;
        }
        .folder-box p:last-child {
            margin-bottom: 0;
            font-size: 0.9em;
            color: #6b7280; /* neutral.gray500 */
        }

        .audio-item { 
            background: #ffffff; 
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            border: 1px solid #e5e7eb; /* neutral.gray200 */
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between; /* Space out content */
            margin-bottom: 15px; /* Spacing between items */
            transition: all 0.2s ease-in-out;
        }
        .audio-item:hover {
            box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .audio-player-controls {
            display: flex;
            align-items: center;
            flex-grow: 1; /* Allow controls to take available space */
        }

        .play-btn {
            background: none;
            border: none;
            color: #6b7280; /* neutral.gray500 */
            font-size: 1.5em; /* Larger icon */
            cursor: pointer;
            transition: color 0.3s ease, transform 0.2s ease;
            width: 30px; /* Fixed width */
            text-align: center;
            flex-shrink: 0;
        }
        .play-btn:hover {
            color: #2563eb; /* primary.main */
        }
        .play-btn.playing {
            color: #10b981; /* semantic.success */
            transform: scale(1.1); /* Subtle scale effect */
        }
        .play-btn.paused {
            color: #ef4444; /* semantic.error */
            transform: scale(1.1);
        }

        .audio-name {
            margin-left: 10px;
            font-weight: 500;
            color: #1f2937; /* neutral.gray800 */
            flex-grow: 1; /* Allow name to grow */
            white-space: nowrap; /* Prevent wrapping */
            overflow: hidden; /* Hide overflow */
            text-overflow: ellipsis; /* Add ellipsis */
            max-width: 250px; /* Limit width */
        }

        progress { 
            width: 120px; /* Slightly smaller progress bar */
            height: 6px; /* Thinner progress bar */
            margin-left: 15px; 
            vertical-align: middle; 
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0.5rem;
        }
        progress::-webkit-progress-bar {
            background-color: #e5e7eb; /* neutral.gray200 */
            border-radius: 0.5rem;
        }
        progress::-webkit-progress-value {
            background-color: #2563eb; /* primary.main */
            border-radius: 0.5rem;
        }
        progress::-moz-progress-bar {
            background-color: #2563eb;
            border-radius: 0.5rem;
        }

        .duration {
            font-size: 0.85em;
            color: #6b7280; /* neutral.gray500 */
            margin-left: 10px;
            flex-shrink: 0;
        }

        textarea {
            flex-grow: 2; /* Allow textarea to take more space */
            margin-left: 20px;
            /* Styles inherited from common input styles */
            resize: vertical; /* Allow vertical resizing */
            min-height: 60px; /* Minimum height */
            font-size: 0.95em;
            color: #374151; /* neutral.gray700 */
            line-height: 1.5;
        }

        .delete-btn {
            position: absolute;
            top: 8px; /* Position at top right */
            right: 8px; 
            background: #ef4444; /* semantic.error */
            color: white;
            border: none;
            border-radius: 50%; 
            width: 28px; /* Slightly larger delete button */
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em; /* Clearer 'x' */
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
        }
        .delete-btn:hover {
            opacity: 1;
            background-color: #DC2626; 
            transform: scale(1.1); /* Pop on hover */
        }

        /* Buttons (Transcribe, Save) */
        .btn-primary {
            background-color: #2563eb; /* primary.main */
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .btn-primary:hover {
            background-color: #1d4ed8; /* primary.dark */
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            background-color: #60a5fa; /* primary.accent */
            opacity: 0.7;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        .btn-success {
            background-color: #10b981; /* semantic.success */
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .btn-success:hover {
            background-color: #059669; /* Darker success color */
            transform: translateY(-1px);
        }

        /* Sidebar Enhancements */
        .sidebar-header {
            padding-bottom: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #e5e7eb; /* neutral.gray200 */
        }
        .sidebar-header h2 {
            text-align: center;
        }

        .settings-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .settings-group-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: #4b5563; /* neutral.gray600 */
        }

        .settings-choices {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .setting-choice {
            display: flex;
            align-items: center;
            padding: 0.6rem 0.8rem;
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb; /* neutral.gray200 */
            background-color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            color: #374151; /* neutral.gray700 */
        }
        .setting-choice:hover {
            border-color: #9ca3af; /* neutral.gray400 */
            background-color: #f9fafb; /* neutral.gray50 */
        }
        .setting-choice:has(input:checked) {
            border-color: #3b82f6; /* primary.light */
            background-color: #eff6ff; /* A light blue, derived from primary */
            box-shadow: 0 0 0 1px #3b82f6;
        }
        .setting-choice:has(input:checked) span {
            color: #1d4ed8; /* primary.dark */
            font-weight: 500;
        }

        /* Theme Switcher */
        .theme-switcher {
            display: flex;
            background-color: #e5e7eb; /* neutral.gray200 */
            border-radius: 0.5rem;
            padding: 0.25rem;
            margin-top: auto; /* Push to bottom */
        }
        .theme-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.4rem;
            border-radius: 0.375rem;
            border: none;
            background-color: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            color: #4b5563; /* neutral.gray600 */
        }
        .theme-btn:hover {
            background-color: #d1d5db; /* neutral.gray300 */
        }
        .theme-btn.active {
            background-color: #ffffff;
            color: #111827; /* neutral.gray900 */
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .theme-btn svg {
            width: 1rem;
            height: 1rem;
        }

        /* Dark Mode Styles */
        body.dark {
            background-color: #111827; /* neutral.gray900 */
            color: #d1d5db; /* neutral.gray300 */
        }
        body.dark .sidebar-toggle {
            background: #1f2937; /* neutral.gray800 */
            border-right-color: #374151; /* neutral.gray700 */
        }
        body.dark .content { background: #111827; }
        body.dark h1, body.dark h2 { color: #f9fafb; }
        body.dark select, body.dark input[type="text"], body.dark textarea {
            background-color: #374151; border-color: #4b5563; color: #f3f4f6;
        }
        body.dark select:focus, body.dark input[type="text"]:focus, body.dark textarea:focus {
            border-color: #3b82f6; outline-color: #1d4ed8;
        }
        body.dark .folder-box {
            background: #1f2937; border-color: #4b5563; color: #9ca3af; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.2);
        }
        body.dark .folder-box:hover { background: #374151; border-color: #2563eb; }
        body.dark .audio-item {
            background: #1f2937; border-color: #374151; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.2);
        }
        body.dark .audio-item:hover { box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.2); border-color: #374151; }
        body.dark .audio-name { color: #f3f4f6; }
        body.dark .duration, body.dark .play-btn { color: #9ca3af; }
        body.dark .sidebar-header { border-bottom-color: #374151; }
        body.dark .settings-group-label { color: #9ca3af; }
        body.dark .setting-choice { background-color: #374151; border-color: #4b5563; color: #d1d5db; }
        body.dark .setting-choice:hover { background-color: #4b5563; border-color: #6b7280; }
        body.dark .setting-choice:has(input:checked) { border-color: #60a5fa; background-color: #1e40af; box-shadow: 0 0 0 1px #60a5fa; }
        body.dark .setting-choice:has(input:checked) span { color: #ffffff; }
        body.dark .theme-switcher { background-color: #111827; }
        body.dark .theme-btn { color: #9ca3af; }
        body.dark .theme-btn:hover { background-color: #374151; }
        body.dark .theme-btn.active { background-color: #2563eb; color: #ffffff; }
    </style>
</head>
<body>
    <div class="flex h-screen">
        <button id="toggleBtn" class="toggle-btn">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>

        <div id="sidebar" class="sidebar-toggle fixed h-full z-10 flex flex-col">
            <div class="sidebar-header">
                <h2 class="text-xl font-semibold">Settings</h2>
            </div>
            <div class="settings-container flex-grow">
                <div class="settings-group">
                    <label class="settings-group-label">Upload Option</label>
                    <div class="settings-choices">
                        <label class="setting-choice">
                            <input type="radio" name="uploadOption" value="singleAudio" checked onchange="updateFileInput()" class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-500 transition duration-150 ease-in-out">
                            <span class="ml-3">Single Audio File</span>
                        </label>
                        <label class="setting-choice">
                            <input type="radio" name="uploadOption" value="folderAudios" onchange="updateFileInput()" class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-500 transition duration-150 ease-in-out">
                            <span class="ml-3">Folder with Audios</span>
                        </label>
                        <label class="setting-choice">
                            <input type="radio" name="uploadOption" value="folderSubfolders" onchange="updateFileInput()" class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-500 transition duration-150 ease-in-out">
                            <span class="ml-3">Folder with Subfolders</span>
                        </label>
                    </div>
                </div>
                <div class="settings-group">
                    <label for="language" class="settings-group-label">Language</label>
                    <select class="w-full" id="language">
                        <option value="ur">Urdu</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="settings-group">
                    <label class="settings-group-label">Model</label>
                    <div class="settings-choices">
                        <label class="setting-choice">
                            <input type="radio" name="model" class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-500 transition duration-150 ease-in-out" id="whisperLargeV3" value="whisper-large-v3" checked>
                            <span class="ml-3">Whisper Large V3</span>
                        </label>
                        <label class="setting-choice">
                            <input type="radio" name="model" class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-500 transition duration-150 ease-in-out" id="assemblyAI" value="assemblyAI">
                            <span class="ml-3">Assembly AI</span>
                        </label>
                        <label class="setting-choice">
                            <input type="radio" name="model" class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-500 transition duration-150 ease-in-out" id="deepSpeech" value="deepSpeech">
                            <span class="ml-3">DeepSpeech</span>
                        </label>
                    </div>
                </div>
                <div class="settings-group">
                    <label class="settings-group-label">Export As</label>
                    <div class="settings-choices">
                        <label class="setting-choice">
                            <input type="checkbox" class="form-checkbox h-4 w-4 text-blue-600 focus:ring-blue-500 rounded transition duration-150 ease-in-out" id="excelFormat">
                            <span class="ml-3">Excel Format</span>
                        </label>
                        <label class="setting-choice">
                            <input type="checkbox" class="form-checkbox h-4 w-4 text-blue-600 focus:ring-blue-500 rounded transition duration-150 ease-in-out" id="jsonFormat">
                            <span class="ml-3">JSON Format</span>
                        </label>
                        <label class="setting-choice">
                            <input type="checkbox" class="form-checkbox h-4 w-4 text-blue-600 focus:ring-blue-500 rounded transition duration-150 ease-in-out" id="textFileFormat">
                            <span class="ml-3">TextFile Format</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="settings-group mt-auto pt-4 border-t border-gray-200">
                <label class="settings-group-label">Theme</label>
                <div class="theme-switcher">
                    <button id="theme-light-btn" class="theme-btn" title="Switch to light mode">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.95-4.243l-1.59-1.59M3.75 12H1.5m4.243-4.95l-1.59-1.59" /></svg>
                        <span>Light</span>
                    </button>
                    <button id="theme-dark-btn" class="theme-btn" title="Switch to dark mode">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
                        <span>Dark</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="content" class="content flex-1 p-6 overflow-auto">
            <h1 class="text-4xl font-bold text-center mb-10 text-gray-900">Audio Transcriber</h1>
            <div class="max-w-4xl mx-auto space-y-6">
                <div id="folderBox" class="folder-box" onclick="triggerFileSelection()">
                    <svg class="w-16 h-16 text-blue-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
                    <p class="text-xl font-semibold">Drag & Drop Your Audio Files Here or Click to Browse</p>
                    <p class="text-sm mt-2">Supports single files, folders with audios, or folders with subfolders. Select your upload option in the sidebar settings.</p>
                </div>

                <div class="flex justify-center space-x-4 mt-6">
                    <button id="transcribeBtn" class="btn-primary hidden" onclick="transcribeLoadedAudios()">
                        Transcribe Audio(s)
                    </button>
                    <button id="saveBtn" class="btn-success hidden" onclick="saveTranscriptions()">
                        Save Transcriptions
                    </button>
                </div>
                
                <div id="audioList" class="space-y-4">
                    </div>
            </div>
        </div>
    </div>
    <input type="file" id="singleAudioInput" class="hidden" accept="audio/*" onchange="handleFileSelection(event)">
    <input type="file" id="folderInput" class="hidden" webkitdirectory directory onchange="handleFileSelection(event)">
    <audio id="globalAudio" style="display:none;"></audio>

    <script>
        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('content');
        const toggleBtn = document.getElementById('toggleBtn');
        const transcribeBtn = document.getElementById('transcribeBtn');
        const saveBtn = document.getElementById('saveBtn');
        const globalAudio = document.getElementById('globalAudio');
        const singleAudioInput = document.getElementById('singleAudioInput');
        const folderInput = document.getElementById('folderInput');
        const audioList = document.getElementById('audioList');
        const lightThemeBtn = document.getElementById('theme-light-btn');
        const darkThemeBtn = document.getElementById('theme-dark-btn');

        let isCollapsed = false;
        let currentPath = null;
        let currentButton = null;
        let currentAudioName = null; 
        let loadedAudios = []; 

        // --- Theme Switcher ---
        lightThemeBtn.addEventListener('click', () => setTheme('light'));
        darkThemeBtn.addEventListener('click', () => setTheme('dark'));

        function setTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark');
                lightThemeBtn.classList.remove('active');
                darkThemeBtn.classList.add('active');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark');
                darkThemeBtn.classList.remove('active');
                lightThemeBtn.classList.add('active');
                localStorage.setItem('theme', 'light');
            }
        }

        // Initial setup for file input visibility
        updateFileInput();

        // Initialize sidebar state on load
        if (window.innerWidth < 768) { // Collapse by default on smaller screens
            isCollapsed = true;
            sidebar.classList.add('collapsed');
            content.classList.remove('expanded');
            content.classList.add('collapsed');
            toggleBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>';
        } else {
            content.classList.add('expanded');
            toggleBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
        }

        // Apply saved or system-preferred theme on load
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const defaultTheme = savedTheme || (prefersDark ? 'dark' : 'light');
        setTheme(defaultTheme);

        toggleBtn.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            sidebar.classList.toggle('collapsed', isCollapsed);
            content.classList.toggle('expanded', !isCollapsed);
            content.classList.toggle('collapsed', isCollapsed);
            if (isCollapsed) {
                toggleBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>';
            } else {
                toggleBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
            }
        });

        function triggerFileSelection() {
            const selectedOption = document.querySelector('input[name="uploadOption"]:checked').value;
            if (selectedOption === 'singleAudio') {
                singleAudioInput.click();
            } else {
                folderInput.click();
            }
        }

        function updateFileInput() {
            const selectedOption = document.querySelector('input[name="uploadOption"]:checked').value;
            if (selectedOption === 'singleAudio') {
                singleAudioInput.removeAttribute('webkitdirectory');
                singleAudioInput.removeAttribute('directory');
                singleAudioInput.multiple = false;
                singleAudioInput.accept = "audio/*";
                folderInput.value = null; // Clear folder input
            } else {
                folderInput.setAttribute('webkitdirectory', '');
                folderInput.setAttribute('directory', '');
                folderInput.multiple = true; 
                singleAudioInput.value = null; // Clear single audio input
            }
        }

        async function handleFileSelection(event) {
            const files = event.target.files;
            if (files.length === 0) {
                return;
            }

            const formData = new FormData();
            const selectedOption = document.querySelector('input[name="uploadOption"]:checked').value;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                // Only process audio files
                if (!file.type.startsWith('audio/')) {
                    console.warn(`Skipping non-audio file: ${file.name}`);
                    continue;
                }

                let relativePath = file.name; 
                if (selectedOption !== 'singleAudio') {
                    // For folder uploads, webkitRelativePath provides the full path
                    relativePath = file.webkitRelativePath || file.name;
                }
                formData.append('audioFiles', file, relativePath); 
            }
            
            if (Array.from(formData.entries()).length === 0) {
                alert('No audio files selected or found in the chosen folder.');
                return;
            }

            try {
                const response = await fetch('/upload_audios', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.audios && data.audios.length > 0) {
                    loadedAudios = data.audios.map(audio => ({ ...audio, transcribed: false }));
                    audioList.innerHTML = ''; // Clear previous list
                    loadedAudios.forEach(audio => {
                        const div = document.createElement('div');
                        div.className = 'audio-item';
                        div.id = `audio-item-${audio.name}`;
                        div.innerHTML = `
                        <div style="display: flex; justify-content: center; width: 100%;">
                            <div style="display: flex; gap: 100px; align-items: flex-start; max-width: 800px; margin: 0 auto;">
                                <div class="audio-player-controls">
                                    <button class="play-btn" data-path="/serve_audio?path=${encodeURIComponent(audio.path)}">
                                        ▶
                                    </button>
                                    <span class="audio-name" title="${audio.display_name}">${audio.display_name}</span>
                                    <progress class="progress-bar" id="progress_${audio.name}" value="0" max="100"></progress>
                                    <span class="duration" id="duration_${audio.name}">0:00 / 0:00</span>
                                </div>
                                <textarea id="trans_${audio.name}" placeholder="Transcription will appear here..." rows="1"></textarea>
                                <button class="delete-btn" data-name="${audio.name}">×</button>
                            </div>
                        </div>
                    `;
                    audioList.appendChild(div);
                    });
                    transcribeBtn.classList.remove('hidden');
                    saveBtn.classList.add('hidden'); 
                } else {
                    alert('No audio files found or uploaded.');
                    transcribeBtn.classList.add('hidden');
                    saveBtn.classList.add('hidden');
                    audioList.innerHTML = '';
                }
            } catch (error) {
                console.error('Error uploading audios:', error);
                alert('Failed to upload audio files. Please check the console for details.');
            } finally {
                // Clear the file input's value to allow re-uploading the same file(s)
                event.target.value = null;
            }
        }

        function transcribeLoadedAudios() {
            if (loadedAudios.length === 0) {
                alert('No audios loaded to transcribe.');
                return;
            }
            const model = document.querySelector('input[name="model"]:checked').value;
            const language = document.getElementById('language').value;
            
            transcribeBtn.textContent = 'Transcribing...';
            transcribeBtn.disabled = true;

            fetch('/transcribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ audios: loadedAudios.map(a => a.path), model, language })
            })
            .then(response => response.json())
            .then(data => {
                data.transcriptions.forEach(trans => {
                    const textarea = document.getElementById(`trans_${trans.name}`);
                    if (textarea) {
                        textarea.value = trans.transcription;
                        const audioObj = loadedAudios.find(a => a.name === trans.name);
                        if (audioObj) {
                            audioObj.transcription = trans.transcription; 
                            audioObj.transcribed = true;
                        }
                    }
                });
                transcribeBtn.classList.add('hidden');
                transcribeBtn.textContent = 'Transcribe Audio(s)';
                transcribeBtn.disabled = false;
                saveBtn.classList.remove('hidden'); 
            })
            .catch(error => {
                console.error('Transcription error:', error);
                alert('Transcription failed. Please check the console for errors.');
                transcribeBtn.textContent = 'Transcribe Audio(s)';
                transcribeBtn.disabled = false;
            });
        }

        function saveTranscriptions() {
    const excelFormat = document.getElementById('excelFormat').checked;
    const jsonFormat = document.getElementById('jsonFormat').checked;
    const textFileFormat = document.getElementById('textFileFormat').checked;

    if (!excelFormat && !jsonFormat && !textFileFormat) {
        alert('Please select at least one export format.');
        return;
    }

    const transcriptions = loadedAudios.filter(a => a.transcribed).map(a => ({
        name: a.display_name, 
        transcription: document.getElementById(`trans_${a.name}`).value 
    }));

    if (transcriptions.length === 0) {
        alert('No transcriptions available to save.');
        return;
    }

    // Helper function to trigger download
    const downloadFile = (content, fileName, contentType) => {
        const a = document.createElement('a');
        const file = new Blob([content], {type: contentType});
        a.href = URL.createObjectURL(file);
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    };

    if (excelFormat) {
        fetch('/save_excel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ transcriptions })
        })
        .then(response => response.blob())
        .then(blob => {
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            downloadFile(blob, `transcriptions_${timestamp}.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
        })
        .catch(error => console.error('Excel save error:', error));
    }

    if (jsonFormat) {
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        const jsonContent = JSON.stringify(transcriptions, null, 2);
        downloadFile(jsonContent, `transcriptions_${timestamp}.json`, 'application/json');
    }

    if (textFileFormat) {
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        let txtContent = '';
        transcriptions.forEach(item => {
            const speaker = item.name.replace(/[0-9]/g, '').replace(/\.[^/.]+$/, '');
            txtContent += `${speaker || 'UnknownSpeaker'}\t${item.transcription}\n`;
        });
        downloadFile(txtContent, `transcriptions_${timestamp}.txt`, 'text/plain');
    }
}

        // --- Main Playback Logic ---
        document.addEventListener('click', (e) => {
        // Handle Play/Pause button clicks
        if (e.target.classList.contains('play-btn') || e.target.closest('.play-btn')) {
            const playButton = e.target.closest('.play-btn');
            const clickedPath = playButton.getAttribute('data-path');
            const audioItemDiv = playButton.closest('.audio-item');
            const textareaId = audioItemDiv ? audioItemDiv.querySelector('textarea[id^="trans_"]').id : '';
            const clickedAudioName = textareaId.replace('trans_', ''); 

            // Case 1: Clicking the same button that's currently playing
            if (currentPath === clickedPath && !globalAudio.paused) {
                globalAudio.pause();
                playButton.classList.remove('playing');
                playButton.classList.add('paused');
                playButton.innerHTML = '▶';
                return;
            }

            // Case 2: Clicking the same button that's currently paused
            if (currentPath === clickedPath && globalAudio.paused) {
                globalAudio.play()
                    .then(() => {
                        playButton.classList.remove('paused');
                        playButton.classList.add('playing');
                        playButton.innerHTML = '❚❚';
                    })
                    .catch(error => console.error('Resume play error:', error));
                return;
            }

            // Case 3: Different audio or no audio loaded
            // Stop current audio if playing
            if (currentPath && !globalAudio.paused) {
                globalAudio.pause();
                if (currentButton) {
                    currentButton.classList.remove('playing');
                    currentButton.classList.add('paused');
                    currentButton.innerHTML = '▶';
                }
            }

            // Reset current audio if different audio is selected
            if (currentPath !== clickedPath) {
                globalAudio.pause();
                globalAudio.currentTime = 0;
                
                // Reset previous audio UI
                if (currentButton && currentPath !== clickedPath) {
                    currentButton.classList.remove('playing');
                    currentButton.classList.add('paused');
                    currentButton.innerHTML = '▶';
                    if (currentAudioName) {
                        updateProgress(currentAudioName, true);
                    }
                }
                
                // Load new audio
                globalAudio.src = clickedPath;
                currentPath = clickedPath;
                currentButton = playButton;
                currentAudioName = clickedAudioName;
            }

            // Play the audio
            globalAudio.play()
                .then(() => {
                    playButton.classList.remove('paused');
                    playButton.classList.add('playing');
                    playButton.innerHTML = '❚❚';
                })
                .catch(error => console.error('Play error:', error));
        } 
            // Handle Delete button clicks (Event Delegation)
            else if (e.target.classList.contains('delete-btn')) {
                const audioNameToDelete = e.target.getAttribute('data-name');
                deleteAudio(audioNameToDelete);
            }
        });

        // --- Global Audio Event Listeners (Defined Once) ---
        globalAudio.onended = () => {
            if (currentAudioName) {
                updateProgress(currentAudioName, true); // Reset progress for the ended audio
            }
            // Reset global state variables when audio truly ends
            currentPath = null;
            currentAudioName = null; 
            if (currentButton) {
                currentButton.classList.remove('playing');
                currentButton.classList.add('paused');
                currentButton.innerHTML = '▶'; // Reset icon to play
                currentButton = null; 
            }
        };

        globalAudio.addEventListener('loadedmetadata', () => {
            if (currentAudioName) { 
                updateDuration(currentAudioName);
            }
        });

        globalAudio.addEventListener('timeupdate', () => {
            if (currentAudioName) { 
                updateProgress(currentAudioName);
            }
        });

        // --- Helper Functions for UI Updates ---
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function updateDuration(name) {
            const durationSpan = document.getElementById(`duration_${name}`);
            const totalDuration = isNaN(globalAudio.duration) ? 0 : globalAudio.duration;
            durationSpan.textContent = `0:00 / ${formatTime(totalDuration)}`;
        }

        function updateProgress(name, reset = false) {
            const progressBar = document.getElementById(`progress_${name}`);
            const durationSpan = document.getElementById(`duration_${name}`);
            if (!progressBar || !durationSpan) { 
                return;
            }
            if (reset || isNaN(globalAudio.duration)) {
                progressBar.value = 0;
                durationSpan.textContent = `0:00 / 0:00`;
            } else {
                const progress = (globalAudio.currentTime / globalAudio.duration) * 100;
                progressBar.value = progress;
                durationSpan.textContent = `${formatTime(globalAudio.currentTime)} / ${formatTime(globalAudio.duration)}`;
            }
        }

        // --- New Function to Delete Audio Item ---
        function deleteAudio(audioName) {
            if (!confirm(`Are you sure you want to delete "${audioName}" from the list? This will not delete the original file.`)) {
                return;
            }

            // Stop audio if it's currently playing and is the one being deleted
            if (currentAudioName === audioName) {
                globalAudio.pause();
                globalAudio.currentTime = 0;
                currentPath = null;
                if (currentButton) {
                    currentButton.classList.remove('playing', 'paused');
                    currentButton.innerHTML = '▶';
                }
                currentButton = null;
                currentAudioName = null;
            }

            // Remove from loadedAudios array
            loadedAudios = loadedAudios.filter(audio => audio.name !== audioName);

            // Remove from DOM
            const audioItemElement = document.getElementById(`audio-item-${audioName}`);
            if (audioItemElement) {
                audioItemElement.remove();
            }

            // Hide Transcribe/Save buttons if no audios are left
            if (loadedAudios.length === 0) {
                transcribeBtn.classList.add('hidden');
                saveBtn.classList.add('hidden');
            }
        }
    </script>
